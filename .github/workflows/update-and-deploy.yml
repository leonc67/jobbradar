name: Hent stillinger og publiser

on:
  schedule:
    - cron: '17 5 * * *' # hver dag 06:17/07:17 norsk tid
  workflow_dispatch: # kan kjøres manuelt fra Actions-fanen
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jobbradar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Hent stillinger
        if: github.event_name != 'push'
        env:
          NAV_API_TOKEN: ${{ secrets.NAV_API_TOKEN }}
        run: npm run fetch

      - name: Commit oppdaterte data
        if: github.event_name != 'push'
        run: |
          git config user.name "jobbradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/jobs.json data/nav-state.json
          git diff --staged --quiet || git commit -m "Oppdater stillinger $(date -u +%F)"
          git push

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
